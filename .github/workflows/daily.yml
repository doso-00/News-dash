name: Edizione quotidiana

# L'edizione quotidiana la scrive un'attività programmata di Claude Code (vedi REDAZIONE.md)
# e il suo push pubblica l'app. La generazione qui sotto serve solo se avvii il workflow a mano
# e hai impostato il secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rigenera anche se l'edizione di oggi esiste già"
        type: boolean
        default: false
  push:

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Without the secret the run only republishes the app.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "Nessun secret ANTHROPIC_API_KEY, salto la generazione e pubblico l'app."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_KEY == 'true'
        run: npm ci
      - name: Genera l'edizione di oggi
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.mjs ${{ inputs.force && '--force' || '' }}
      - if: env.HAS_KEY == 'true'
        run: node scripts/validate.mjs
      - name: Salva nel repository
        if: env.HAS_KEY == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessuna novità da salvare."
          else
            git commit -m "Edizione del $(TZ=Europe/Rome date +%F)"
            git push
          fi

  deploy:
    needs: generate
    if: >-
      always() &&
      (needs.generate.result == 'success' || needs.generate.result == 'skipped') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
