name: Esporta interessi

# Every night copies the interests of the people signed up (no names, no usernames) into
# data/interests.json, so the editor can write cards for them. The editing session can't
# reach the database itself.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: export-interests
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Leggi gli interessi dal database
        run: |
          URL=$(jq -r .supabaseUrl config/backend.json)
          KEY=$(jq -r .supabaseKey config/backend.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Database non configurato."; exit 0; fi
          curl -sf "$URL/rest/v1/players?select=stats" -H "apikey: $KEY" \
            | jq '{updatedAt: (now | todate), profiles: [ .[] | (.stats.interests // []) | select(length > 0) ] | sort}' \
            > /tmp/interests.json
          jq -c '{profili: (.profiles | length)}' /tmp/interests.json
          # keep the old timestamp when nothing changed, so we don't commit every night
          if [ -f data/interests.json ] && [ "$(jq -c .profiles data/interests.json)" = "$(jq -c .profiles /tmp/interests.json)" ]; then
            echo "Nessuna novità."
          else
            cp /tmp/interests.json data/interests.json
          fi
      - name: Pulisci i messaggi con più di 30 giorni
        run: |
          URL=$(jq -r .supabaseUrl config/backend.json)
          KEY=$(jq -r .supabaseKey config/backend.json)
          [ -z "$URL" ] && exit 0
          # not an error if the chat functions don't exist yet
          curl -s -o /dev/null -w "pulizia messaggi: HTTP %{http_code}\n" -X POST "$URL/rest/v1/rpc/purge_old_messages" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' || true
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interests.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Interessi aggiornati"
            git push
          fi
